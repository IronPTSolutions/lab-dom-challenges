<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 - Counter</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
    }

    .counter-display {
      font-size: 80px;
      font-weight: bold;
      color: #2c3e50;
      margin: 30px 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      padding: 12px 24px;
      font-size: 20px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      color: white;
      min-width: 60px;
    }

    #decrease-btn {
      background-color: #e74c3c;
    }

    #reset-btn {
      background-color: #95a5a6;
    }

    #increase-btn {
      background-color: #27ae60;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>Counter</h1>
  <p>Usa los botones para incrementar, decrementar o resetear el contador.</p>

  <div id="counter-display" class="counter-display">0</div>

  <div class="controls">
    <button id="decrease-btn">-</button>
    <button id="reset-btn">Reset</button>
    <button id="increase-btn">+</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
