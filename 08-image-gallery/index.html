<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 - Image Gallery</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
    }

    .main-image {
      width: 100%;
      height: 350px;
      background-color: #ecf0f1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      font-size: 20px;
      color: #7f8c8d;
      overflow: hidden;
    }

    .main-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
    }

    .navigation {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .navigation button {
      padding: 10px 24px;
      font-size: 16px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
    }

    .navigation button:hover {
      background-color: #2980b9;
    }

    .thumbnails {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .thumbnails .thumb {
      width: 80px;
      height: 60px;
      border-radius: 6px;
      cursor: pointer;
      border: 3px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      font-weight: bold;
    }

    .thumbnails .thumb.active {
      border-color: #3498db;
    }

    .counter {
      margin-top: 15px;
      font-size: 14px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <h1>Image Gallery</h1>
  <p>Navega entre imagenes usando los botones o haz click en un thumbnail.</p>

  <div id="main-image" class="main-image">
    <span id="main-display" style="font-size: 60px;">🏔️</span>
  </div>

  <div class="navigation">
    <button id="prev-btn">← Anterior</button>
    <button id="next-btn">Siguiente →</button>
  </div>

  <div id="thumbnails" class="thumbnails">
    <div class="thumb active" data-index="0" style="background-color: #1abc9c;">🏔️</div>
    <div class="thumb" data-index="1" style="background-color: #e74c3c;">🌅</div>
    <div class="thumb" data-index="2" style="background-color: #3498db;">🌊</div>
    <div class="thumb" data-index="3" style="background-color: #f39c12;">🌻</div>
    <div class="thumb" data-index="4" style="background-color: #9b59b6;">🌌</div>
  </div>

  <p id="counter" class="counter">1 / 5</p>

  <script src="script.js"></script>
</body>
</html>
