<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 - Form Validation</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 2px solid #bdc3c7;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #3498db;
    }

    input.valid {
      border-color: #27ae60;
    }

    input.invalid {
      border-color: #e74c3c;
    }

    .error-message {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 4px;
      min-height: 18px;
    }

    .success-message {
      color: #27ae60;
      font-size: 13px;
      margin-top: 4px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      background-color: #219a52;
    }

    button[type="submit"]:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    #form-result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }

    #form-result.success {
      display: block;
      background-color: #eafaf1;
      border: 1px solid #27ae60;
      color: #27ae60;
    }
  </style>
</head>
<body>
  <h1>Form Validation</h1>
  <p>Rellena el formulario. La validacion se realiza en tiempo real.</p>

  <form id="signup-form" novalidate>
    <div class="form-group">
      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" placeholder="Minimo 3 caracteres">
      <p class="error-message" id="username-error"></p>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="ejemplo@email.com">
      <p class="error-message" id="email-error"></p>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Minimo 6 caracteres">
      <p class="error-message" id="password-error"></p>
    </div>

    <div class="form-group">
      <label for="confirm-password">Confirmar contraseña</label>
      <input type="password" id="confirm-password" placeholder="Repite la contraseña">
      <p class="error-message" id="confirm-password-error"></p>
    </div>

    <button type="submit">Registrarse</button>
  </form>

  <div id="form-result"></div>

  <script src="script.js"></script>
</body>
</html>
