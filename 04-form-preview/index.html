<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 - Form Preview</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      color: #2c3e50;
    }

    .container {
      display: flex;
      gap: 30px;
    }

    .form-section, .preview-section {
      flex: 1;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #34495e;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    .preview-card {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 20px;
      margin-top: 12px;
    }

    .preview-card h3 {
      margin-top: 0;
      color: #2c3e50;
    }

    .preview-card p {
      color: #555;
      margin: 8px 0;
    }

    .preview-card .preview-label {
      font-weight: bold;
      color: #7f8c8d;
      font-size: 12px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1>Form Preview</h1>
  <p>Escribe en el formulario y observa como se actualiza la tarjeta de preview en tiempo real.</p>

  <div class="container">
    <div class="form-section">
      <h2>Formulario</h2>
      <label for="name-input">Nombre</label>
      <input type="text" id="name-input" placeholder="Tu nombre...">

      <label for="email-input">Email</label>
      <input type="email" id="email-input" placeholder="tu@email.com">

      <label for="bio-input">Bio</label>
      <textarea id="bio-input" placeholder="Cuentanos algo sobre ti..."></textarea>
    </div>

    <div class="preview-section">
      <h2>Preview</h2>
      <div class="preview-card">
        <h3 id="preview-name">Tu nombre</h3>
        <p class="preview-label">Email</p>
        <p id="preview-email">tu@email.com</p>
        <p class="preview-label">Bio</p>
        <p id="preview-bio">Cuentanos algo sobre ti...</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
